<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizarrón Mágico | DOMHE Kids</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/kids.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header" style="flex-direction: column; padding-bottom: 5px;">
            <a href="./" class="back-btn" style="top: 15px;"><i class="fas fa-arrow-left"></i></a>
            <div class="logo-area">
                <img src="https://res.cloudinary.com/dwoau0ajc/image/upload/v1753327639/WhatsApp_Image_2025-07-23_at_19.59.09_yd4dtt.png" alt="DOMHE Logo" class="logo">
                <h1>Pizarrón</h1>
            </div>
            <div class="draw-prompt" style="margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;">
                <span style="font-size: 0.9rem; color: #666;">Dibuja:</span>
                <span id="draw-word" style="font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: #E81A63; background: #FFE5F0; padding: 5px 15px; border-radius: 20px;"></span>
                <button id="new-word-btn" style="background: #FF98B8; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 0.8rem;"><i class="fas fa-sync-alt"></i></button>
            </div>
        </header>

        <main class="game-area">
            <div class="canvas-wrapper">
                <canvas id="drawing-canvas"></canvas>
            </div>
        </main>

        <footer class="toolbar">
            <div class="colors-palette">
                <button class="color-btn active" style="background-color: #FF98B8;" data-color="#FF98B8"></button>
                <button class="color-btn" style="background-color: #A1CD3A;" data-color="#A1CD3A"></button>
                <button class="color-btn" style="background-color: #15AAE2;" data-color="#15AAE2"></button>
                <button class="color-btn" style="background-color: #793AB8;" data-color="#793AB8"></button>
                <button class="color-btn" style="background-color: #FE8604;" data-color="#FE8604"></button>
                <button class="color-btn" style="background-color: #333333;" data-color="#333333"></button>
                <button class="color-btn eraser-btn" style="background-color: #FFFFFF;" data-color="#FFFFFF">
                    <i class="fas fa-eraser"></i>
                </button>
            </div>
            <div class="actions">
                <div class="size-picker" style="background:#F5F5F5; padding: 5px 15px; border-radius: 20px; align-items:center;">
                    <label for="brush-size" style="font-weight:bold; margin-right:10px; color:#E81A63;"><i class="fas fa-paint-brush"></i></label>
                    <input type="range" id="brush-size" min="2" max="30" value="8">
                </div>
                <button id="clear-btn" class="action-btn"><i class="fas fa-trash-alt"></i></button>
                <button id="save-btn" class="action-btn save"><i class="fas fa-download"></i> Guardar</button>
            </div>
        </footer>
    </div>
    
    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/draw.js"></script>
    <script>
        // Drawing prompts for kids
        const drawingPrompts = [
            // Animals
            'Un Perro', 'Un Gato', 'Una Mariposa', 'Un Pez', 'Un Conejo', 'Una Tortuga', 
            'Un Elefante', 'Un León', 'Un Pájaro', 'Una Abeja', 'Un Dinosaurio', 'Un Delfín',
            // Food
            'Una Pizza', 'Un Helado', 'Una Manzana', 'Un Pastel', 'Una Hamburguesa', 
            'Unas Fresas', 'Un Plátano', 'Un Hot Dog', 'Unos Tacos', 'Un Sandwich',
            // Places
            'La Playa', 'Un Bosque', 'Una Montaña', 'El Mar', 'Una Casa', 'Un Castillo',
            'El Sol', 'La Luna', 'Un Arcoíris', 'Un Jardín', 'Un Parque',
            // Family
            'Mi Familia', 'Mi Mascota', 'Mi Casa', 'Mis Amigos', 'Mi Mamá', 'Mi Papá',
            // Objects
            'Un Carro', 'Un Avión', 'Un Barco', 'Una Flor', 'Un Árbol', 'Una Estrella',
            'Un Corazón', 'Un Robot', 'Una Pelota', 'Un Globo'
        ];

        function getRandomPrompt() {
            return drawingPrompts[Math.floor(Math.random() * drawingPrompts.length)];
        }

        // Initialize drawing prompt
        document.getElementById('draw-word').textContent = getRandomPrompt();

        // New word button
        document.getElementById('new-word-btn').addEventListener('click', () => {
            const btn = document.getElementById('new-word-btn');
            btn.style.transform = 'rotate(360deg)';
            btn.style.transition = 'transform 0.5s';
            
            document.getElementById('draw-word').textContent = getRandomPrompt();
            
            setTimeout(() => {
                btn.style.transform = 'rotate(0deg)';
            }, 500);
        });
    </script>
</body>
</html>
