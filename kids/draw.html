<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizarrón Mágico | DOMHE Kids</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/kids.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="logo-area">
                <img src="https://res.cloudinary.com/dwoau0ajc/image/upload/v1753327639/WhatsApp_Image_2025-07-23_at_19.59.09_yd4dtt.png" alt="DOMHE Logo" class="logo">
                <h1>Pizarrón</h1>
            </div>
        </header>

        <main class="game-area">
            <div class="canvas-wrapper">
                <canvas id="drawing-canvas"></canvas>
            </div>
        </main>

        <footer class="toolbar">
            <div class="colors-palette">
                <button class="color-btn active" style="background-color: #FF98B8;" data-color="#FF98B8"></button>
                <button class="color-btn" style="background-color: #A1CD3A;" data-color="#A1CD3A"></button>
                <button class="color-btn" style="background-color: #15AAE2;" data-color="#15AAE2"></button>
                <button class="color-btn" style="background-color: #793AB8;" data-color="#793AB8"></button>
                <button class="color-btn" style="background-color: #FE8604;" data-color="#FE8604"></button>
                <button class="color-btn" style="background-color: #333333;" data-color="#333333"></button>
                <button class="color-btn eraser-btn" style="background-color: #FFFFFF;" data-color="#FFFFFF">
                    <i class="fas fa-eraser"></i>
                </button>
            </div>
            <div class="actions">
                <div class="size-picker" style="background:#F5F5F5; padding: 5px 15px; border-radius: 20px; align-items:center;">
                    <label for="brush-size" style="font-weight:bold; margin-right:10px; color:#E81A63;"><i class="fas fa-paint-brush"></i></label>
                    <input type="range" id="brush-size" min="2" max="30" value="8">
                </div>
                <button id="clear-btn" class="action-btn"><i class="fas fa-trash-alt"></i></button>
                <button id="save-btn" class="action-btn save"><i class="fas fa-download"></i> Guardar</button>
            </div>
        </footer>
    </div>
    
    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/draw.js"></script>
</body>
</html>
